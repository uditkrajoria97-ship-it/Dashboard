<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem III dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E4E4E0;--page-ink:#111111;--page-muted:#5E5E5A;--rule:rgba(0,0,0,.14);
  --glow-a:rgba(221,243,91,.55);--glow-b:rgba(242,103,43,.22);--glow-c:rgba(169,181,245,.38);
  --lime:#DDF35B;--lav:#A9B5F5;--orange:#F2672B;--blue:#2E5BF0;
  --c-study:#A9B5F5;--c-work:#DDF35B;--c-personal:#F5F5F2;--c-health:#3DBE6A;
  --radius:24px;--gap:14px;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0A0A0A;--page-ink:#F5F5F2;--page-muted:#8C8C87;--rule:rgba(255,255,255,.14);--glow-a:rgba(221,243,91,.08);--glow-b:rgba(242,103,43,.09);--glow-c:rgba(46,91,240,.14);color-scheme:dark}}
:root[data-theme="dark"]{--page:#0A0A0A;--page-ink:#F5F5F2;--page-muted:#8C8C87;--rule:rgba(255,255,255,.14);--glow-a:rgba(221,243,91,.08);--glow-b:rgba(242,103,43,.09);--glow-c:rgba(46,91,240,.14);color-scheme:dark}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--page-ink);font-family:'DM Sans','Helvetica Neue',Arial,system-ui,sans-serif;font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden;
  background:radial-gradient(55% 45% at 0% 0%,var(--glow-a),transparent 70%),radial-gradient(40% 45% at 100% 100%,var(--glow-b),transparent 70%),radial-gradient(45% 40% at 75% 0%,var(--glow-c),transparent 70%),var(--page);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* card skins */
.k-lime{background:linear-gradient(140deg,#F4FBA8 0%,#DDF35B 45%,#C3E033 100%);--fg:#111;--fg2:#4D5520;--tr:rgba(0,0,0,.12)}
.k-white{background:linear-gradient(165deg,#FFFFFF,#F0F0EB);--fg:#111;--fg2:#6B6B66;--tr:#E3E3DE}
.k-lav{background:linear-gradient(150deg,#DCE1FF 0%,#A9B5F5 55%,#8C9AF0 100%);--fg:#111;--fg2:#3E4570;--tr:rgba(0,0,0,.12)}
.k-ink{background:#0E0E0E;border:1.5px solid #333;--fg:#F5F5F2;--fg2:#8C8C87;--tr:#262626}
.k-grey{background:linear-gradient(165deg,#5C5C5C 0%,#454545 100%);--fg:#FFF;--fg2:rgba(255,255,255,.72);--tr:rgba(255,255,255,.18)}
.k-dark{background:linear-gradient(160deg,#262626 0%,#161616 100%);--fg:#F5F5F2;--fg2:#8C8C87;--tr:#2C2C2C}
.k-orange{background:linear-gradient(155deg,#FFB47E 0%,#F2672B 50%,#DC4A14 100%);--fg:#111;--fg2:#5A2510;--tr:rgba(0,0,0,.16)}
.k-blue{background:radial-gradient(120% 95% at 88% 12%,#6A8EFF 0%,#2E5BF0 42%,#1A3BC9 100%);--fg:#FFF;--fg2:rgba(255,255,255,.72);--tr:rgba(0,0,0,.22)}

/* frame */
.app{height:100%;display:flex;flex-direction:column;gap:14px;padding:16px 26px 14px;max-width:1600px;margin:0 auto}
.nav{display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--rule);flex:none}
.tabs-main{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tm{flex:none;border:0;background:transparent;padding:10px 16px 12px;font-weight:600;font-size:13.5px;color:var(--page-muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:7px}
.tm[aria-selected="true"]{color:var(--page-ink);border-color:var(--page-ink)}
.tm b{font-size:10.5px;font-weight:700;background:var(--page-ink);color:var(--page);border-radius:99px;padding:1px 7px}
.navr{display:flex;align-items:center;gap:8px;padding-bottom:8px;flex:none}
.seg{display:inline-flex;border:1.5px solid var(--page-ink);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;padding:3px 11px;border-radius:999px;font-weight:600;font-size:12px;color:inherit}
.seg button[aria-pressed="true"]{background:var(--page-ink);color:var(--page)}
.txtbtn{border:0;background:transparent;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:6px 4px}
.round{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--page-ink);background:transparent;display:grid;place-items:center;padding:0}
.foot{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--rule);padding-top:10px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;flex:none;color:var(--page-muted)}

.view{flex:1;min-height:0;display:grid;gap:var(--gap)}
.view[hidden]{display:none}
#vOverview{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr);grid-template-areas:"hero next cal" "tsk rem cal" "gnt gnt cal"}
#vProjects{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"gantt gantt" "prog mil"}
#vInsights{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"trend mix" "focus mix"}
.a-gnt{grid-area:gnt}.a-gantt{grid-area:gantt}.a-prog{grid-area:prog}.a-mil{grid-area:mil}.a-trend{grid-area:trend}.a-focus{grid-area:focus}.a-mix{grid-area:mix}
.a-hero{grid-area:hero}.a-next{grid-area:next}.a-cal{grid-area:cal}.a-tsk{grid-area:tsk}.a-rem{grid-area:rem}

.card{position:relative;border-radius:var(--radius);padding:20px 22px;min-width:0;min-height:0;display:flex;flex-direction:column;color:var(--fg)}
.card.hb{padding-bottom:28px}
.card.hb::after{content:"";position:absolute;left:50%;bottom:10px;width:76px;height:4px;border-radius:9px;background:var(--fg);opacity:.85;transform:translateX(-50%)}
.pb{flex:1;min-height:0;position:relative}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none;min-height:24px}
.lbl{display:inline-flex;align-items:center;border:1.5px solid currentColor;border-radius:999px;padding:1px 9px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:transparent;white-space:nowrap}
.lbl.solid{background:#111;color:#F5F5F2;border-color:#111}
.lbl.warn{background:var(--orange);color:#111;border-color:var(--orange)}
hr.dot{border:0;border-top:2px dotted currentColor;opacity:.45;margin:12px 0;flex:none}
.title{font-size:40px;font-weight:500;letter-spacing:-.045em;line-height:1;margin:0}
.tog{display:inline-flex;border:1.5px solid currentColor;border-radius:999px;padding:2px}
.tog button{border:0;background:transparent;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;color:inherit}
.tog button[aria-pressed="true"]{background:#111;color:#F5F5F2}
.k-ink .tog button[aria-pressed="true"],.k-grey .tog button[aria-pressed="true"],.k-dark .tog button[aria-pressed="true"],.k-blue .tog button[aria-pressed="true"]{background:#F5F5F2;color:#111}
.obtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:8px;border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:12.5px;color:inherit}
.obtn:hover{background:rgba(0,0,0,.06)}
.dotbtn{width:44px;height:44px;border-radius:50%;border:0;background:#111;color:#F5F5F2;display:grid;place-items:center;flex:none}

/* hero */
.hl{font-size:clamp(28px,3.1vw,44px);font-weight:900;letter-spacing:-.02em;line-height:.98;text-transform:uppercase;margin:auto 0 0}
.hl u{text-decoration-thickness:4px;text-underline-offset:5px}
.hl .chipin{display:inline-flex;vertical-align:middle;align-items:center;background:#111;color:var(--lime);border-radius:999px;font-size:.42em;font-weight:700;padding:4px 12px;letter-spacing:0;margin-left:6px;transform:translateY(-.12em)}
.catbar{display:flex;gap:4px;height:12px;margin-top:18px;flex:none}
.catbar button{border:1.5px solid #111;border-radius:99px;padding:0;min-width:0}
.hfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;flex:none}
.catleg{display:flex;gap:4px 10px;min-width:0;font-size:11.5px;font-weight:600;flex-wrap:wrap}
.catleg button{border:0;background:transparent;padding:0;display:inline-flex;align-items:center;gap:5px}
.catleg i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px #111}

.hl{margin:14px 0 0;font-size:clamp(24px,2.5vw,38px)}
#heroBars{margin-top:10px}
.ring{display:flex;gap:12px;align-items:center}
.rleg{display:grid;gap:2px;font-size:11.5px}
.rleg span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.rleg i{width:8px;height:8px;border-radius:50%}
.mil{display:grid;gap:4px;overflow:auto;align-content:start}
.mrow{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--tr);border-left:0;border-right:0;border-top:0;background:transparent;text-align:left;color:inherit;width:100%}
.mrow:last-child{border-bottom:0}
.mrow .dt{border:1.5px solid #111;border-radius:12px;text-align:center;padding:3px 0;line-height:1.05}
.mrow .dt b{display:block;font-size:17px;font-weight:600}
.mrow .dt small{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mrow .nm{font-weight:600;font-size:13px}
.mrow .pj{font-size:11.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow em{font-style:normal;font-size:12px;font-weight:700}
.vlegend{display:flex;gap:14px;font-size:11.5px;color:var(--fg2);flex-wrap:wrap}
.vlegend span{display:inline-flex;align-items:center;gap:6px}
/* tasks (ink card) */
.ttabs{display:flex;gap:4px;flex:none;overflow-x:auto;scrollbar-width:none;margin:10px 0 4px}
.tab{flex:none;border:1.5px solid #3A3A3A;background:transparent;padding:3px 10px;border-radius:999px;font-weight:600;font-size:11.5px;color:var(--fg)}
.tab b{font-weight:600;opacity:.5;margin-left:4px}
.tab[aria-selected="true"]{background:#F5F5F2;color:#111;border-color:#F5F5F2}
.tab.warn b{color:var(--orange);opacity:1}
.tlist{overflow:auto;margin:0 -22px -20px;padding:0 22px 10px}
.task{padding:9px 0;border-bottom:1px solid var(--tr)}
.task:last-child{border-bottom:0}
.trow{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center}
.chk{width:18px;height:18px;border-radius:6px;border:1.5px solid #5A5A5A;background:transparent;display:grid;place-items:center;padding:0}
.chk[aria-checked="true"]{background:var(--lime);border-color:var(--lime)}
.chk svg{opacity:0;color:#111}.chk[aria-checked="true"] svg{opacity:1}
.chk.sm{width:15px;height:15px;border-radius:5px}
.tt{display:flex;align-items:center;gap:7px;min-width:0}
.tt i{width:7px;height:7px;border-radius:50%;flex:none}
.ttitle{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.done .ttitle{opacity:.4;text-decoration:line-through}
.tside{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg2);white-space:nowrap}
.tside .late{color:var(--orange);font-weight:700}
.exp{border:0;background:transparent;color:var(--fg2);padding:0;display:grid;place-items:center;transition:transform .2s}
.exp[aria-expanded="true"]{transform:rotate(180deg)}
.subs{margin:7px 0 0 31px;display:grid;gap:5px}
.stask{display:flex;gap:8px;align-items:center;font-size:12.5px}
.stask.done span{opacity:.4;text-decoration:line-through}
.empty{color:var(--fg2);padding:18px 4px;text-align:center;margin:0}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:rgba(221,243,91,.25)}100%{background:transparent}}

/* up next (white, notched) */
.notch{position:absolute;top:-7px;right:-7px;width:62px;height:62px;border-radius:50%;background:var(--page);display:grid;place-items:center}
.notch button{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(140deg,#F4FBA8,#C3E033);color:#111;display:grid;place-items:center}
.a-next .ph{padding-right:46px}
.nxt{border:0;background:transparent;padding:0;text-align:left;font-size:clamp(22px,2.1vw,30px);font-weight:500;letter-spacing:-.04em;line-height:1.02;margin-top:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.duerow{display:flex;justify-content:space-between;align-items:baseline;flex:none}
.duerow>span:not(.info){font-size:22px;font-weight:500;letter-spacing:-.03em}
.duerow b{font-size:22px;font-weight:600;letter-spacing:-.04em}
.info{display:flex;align-items:center;gap:7px;font-size:12px;margin:8px 0 0;color:var(--fg2);flex:none}
.info i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px #111;flex:none}
.nlist{overflow:auto;margin:8px -6px 0;padding:0 6px}
.nrow{width:100%;display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:center;border:0;background:transparent;padding:7px 0;border-bottom:1px solid var(--tr);text-align:left;font-size:12.5px;font-weight:500}
.nrow:last-child{border-bottom:0}
.nrow i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px #111}
.nrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow em{font-style:normal;color:var(--fg2);font-variant-numeric:tabular-nums}
.nrow:hover span{text-decoration:underline}

/* reminders (lavender) */
.remhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex:none}
.remlist{overflow:auto;display:grid;gap:6px;align-content:start;margin-top:4px}
.ri{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--tr)}
.ri:last-child{border-bottom:0}
.ri time{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-width:58px}
.ri.soon time{color:#111;background:var(--lime);border-radius:99px;padding:1px 8px;text-align:center}
.ri .txt{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .acts{display:flex;gap:4px}
.ri .acts button{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35);background:transparent;display:grid;place-items:center;padding:0}
.addrem{display:flex;gap:6px;flex:none;margin-top:8px}
.addrem[hidden]{display:none}
.addrem input{border:1.5px solid #111;background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;min-width:0;color:#111}
.addrem #remText{flex:1}.addrem #remWhen{width:108px}

/* calendar (grey) */
.calnav{display:inline-flex;align-items:center;border:1.5px solid currentColor;border-radius:999px;padding:1px}
.calnav button{border:0;background:transparent;width:22px;height:22px;padding:0;display:grid;place-items:center}
.calnav strong{min-width:62px;text-align:center;font-size:12px;font-weight:600}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:11px;color:var(--fg2);text-align:center;font-weight:500;margin-bottom:6px;flex:none}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6px;flex:1;min-height:0;max-height:420px}
.dbx{border:1.5px solid rgba(255,255,255,.6);border-radius:11px;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:13px;min-height:0;padding:0}
.dbx.past{opacity:.55}
.dbx.today{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}
.dbx[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff;opacity:1}
.dbx .dots{display:flex;gap:2px;height:5px}
.dbx .dots i{width:5px;height:5px;border-radius:50%}
.dbx .dots i.due{background:var(--orange);border-radius:1px;transform:rotate(45deg)}
.daysum{font-size:12px;margin-top:10px;flex:none;display:grid;gap:3px}
.daysum div{display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.daysum time{color:var(--fg2);font-variant-numeric:tabular-nums;width:40px;flex:none}
.daysum i{width:7px;height:7px;border-radius:50%;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;flex:none}
.stat{border:1.5px solid rgba(255,255,255,.6);border-radius:18px;padding:10px 12px 12px;display:grid;gap:8px}
.stat .n{font-size:28px;font-weight:500;letter-spacing:-.04em;line-height:1}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar span{display:block;height:100%;background:#fff;border-radius:99px}

/* projects + insights */
.big{font-size:40px;font-weight:500;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.chart{display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--fg2);font-family:inherit}
#gchart{overflow:hidden;margin-top:8px}#gmini{overflow:hidden}
.ov{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.ovbig{display:flex;align-items:baseline;gap:10px;align-self:flex-start}
#ovPct{font-size:56px;font-weight:500;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.ovk{font-size:15px;font-weight:500}
.ovpills{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-start}
.ovpills button{display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;padding:4px 12px 4px 5px;font-size:11.5px;font-weight:600}
.ovpills button span{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.6);display:grid;place-items:center}
.ovr{position:relative}
.ovgo{position:absolute;right:-4px;bottom:-4px;width:46px;height:46px;border-radius:50%;border:0;background:#111;color:#fff;display:grid;place-items:center}
.mleg{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;width:100%}
.mleg button{display:grid;grid-template-columns:9px 1fr auto;gap:7px;align-items:center;border:0;background:transparent;padding:4px 8px;border-radius:999px;text-align:left;font-size:12.5px;color:var(--fg)}
.mleg button[aria-pressed="true"],.mleg button:hover{background:rgba(0,0,0,.18)}
.mleg i{width:9px;height:9px;border-radius:50%}
.mleg .ct{font-weight:600}
.arc{cursor:pointer}

#tip{position:fixed;pointer-events:none;background:#111;color:#F5F5F2;padding:7px 10px;border-radius:10px;font-size:12px;line-height:1.35;z-index:50;opacity:0;transition:opacity .12s;max-width:270px;border:1px solid #333}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:40;padding:16px}
.modal.open{display:grid}
.dialog{background:#F5F5F2;color:#111;border-radius:24px;padding:24px;width:min(440px,100%);display:grid;gap:12px}
.dialog h2{margin:0;font-size:30px;font-weight:500;letter-spacing:-.04em}
.dialog label{display:grid;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6B6B66}
.dialog input,.dialog select{border:1.5px solid #111;background:transparent;border-radius:12px;padding:9px 11px;font-weight:500;color:#111;text-transform:none;letter-spacing:0;font-size:13.5px}
.dialog .r2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dialog .fbtns{display:flex;justify-content:flex-end;gap:8px}
.dialog .err{color:var(--orange);font-size:12.5px;min-height:1em;margin:0}
.dialog .obtn.fill{background:#111;color:var(--lime);border-color:#111}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--lime);color:#111;padding:9px 16px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;z-index:60;display:flex;gap:12px;align-items:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}

<script>
/* ===================== Dates & helpers ===================== */
// Snapshot date for the prototype: three weeks into the final stretch of Sem III.
// Change this one line to move "today".
const TODAY=new Date(2026,9,21), NOW=new Date(2026,9,21,14,20);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const P=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((a-b)/864e5);
const rel=n=>iso(add(TODAY,n));
const TISO=iso(TODAY);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt=d=>`${d.getDate()} ${MON[d.getMonth()]}`;
const fmtY=d=>`${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
const hh=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return `${String(H).padStart(2,'0')}:${String(M).padStart(2,'0')}`};
const n1=x=>x.toFixed(1).replace('.0','');
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FIT=()=>!matchMedia('(max-width:1023px), (max-height:620px)').matches;
const RANGE={week:7,month:30,year:365};
const SEM_START='2026-08-03', FINALS='2026-10-31';

/* ===================== Data from the Sem III tracker ===================== */
const COURSES=[
  {id:'pk',n:'Packaging and Production',s:'Packaging',ab:'PKG',c:'#A9B5F5'},
  {id:'dv',n:'Data Visualisation',s:'Data Viz',ab:'DV',c:'#DDF35B'},
  {id:'ge',n:'Game Engine',s:'Game Engine',ab:'GE',c:'#3DBE6A'},
  {id:'ad',n:'Advance Design Research',s:'Design Research',ab:'ADR',c:'#F5F5F2'},
  {id:'cs',n:'Context Setting',s:'Context Setting',ab:'CS',c:'#6FD3E8'},
  {id:'av',n:'Audio Visual Movie',s:'AV Movie',ab:'AVT',c:'#F59AC0'},
  {id:'su',n:'Start up',s:'Start-up',ab:'SU',c:'#F7C948'},
  {id:'si',n:'Summer Internship',s:'Internship',ab:'SI',c:'#B79CFF'},
  {id:'mp',n:'Mini project (Tajinder sir)',s:'Mini project',ab:'MP',c:'#8FE3C0'},
];
const CC=Object.fromEntries(COURSES.map(c=>[c.id,c]));
const CK=COURSES.map(c=>c.id);
const cv=id=>(CC[id]||{c:'#888'}).c;
const CAT=Object.fromEntries(COURSES.map(c=>[c.id,c.s]));
// [course, type, name, due (null = not dated in the sheet), status, subtasks]
const RAW=[
 ['pk','Final','Presentation','2026-10-31','prog',[['Design direction sketches','prog'],['User persona','todo'],['Research: interview','todo'],['Refine the PPT','prog']]],
 ['pk','Final','Final design mockup','2026-10-31','prog',[['Sketches: process documentation','todo']]],
 ['pk','Final','Report','2026-10-31','todo',[['Text content','todo'],['Graphics and images','todo'],['Refinement','todo']]],
 ['dv','Assignment','Assignment 1',null,'done'],
 ['dv','Assignment','Assignment 2',null,'done'],
 ['dv','Assignment','Assignment 3: iconic, indexical, symbolic graphs',null,'prog'],
 ['dv','Final','Assignment 4: Dashboard design','2026-10-31','todo'],
 ['dv','Class exercise','Class exercise 1',null,'done'],
 ['dv','Class exercise','Class exercise 2',null,'done'],
 ['dv','Class exercise','Class exercise 3',null,'done'],
 ['dv','Class exercise','Class exercise 4',null,'done'],
 ['dv','Class exercise','Class exercise 5',null,'done'],
 ['dv','Class exercise','Class exercise 6',null,'done'],
 ['dv','Class exercise','Class exercise 7: schematic map',null,'done'],
 ['dv','Ongoing','Journal',null,'prog'],
 ['ge','Final','Interactive environment','2026-10-31','prog',[['Environment','prog'],['Character actions: blueprints','todo'],['Final test','todo']]],
 ['ad','Final','Research paper','2026-10-31','prog',[['Topic discussion PPT','done'],['Final PPT','prog'],['Data collection','prog'],['Final analysis','todo'],['Research paper: finished','todo']]],
 ['ad','Ongoing','Journal',null,'prog'],
 ['cs','Final','Research report and PPT','2026-10-31','done',[['PPT 2: data collection (cont.)','done'],['Final analysis','done'],['Report','done'],['Final PPT','done']]],
 ['cs','Assignment','PPT 1',null,'done'],
 ['cs','Assignment','PPT 2: data collection',null,'done'],
 ['av','Final','Audio visual movie','2026-10-31','prog'],
 ['av','Assignment','Script',null,'done'],
 ['av','Assignment','Storyboarding',null,'prog'],
 ['av','Assignment','Trailer','2026-10-23','todo'],
 ['av','Assignment','Movie','2026-11-06','prog'],
 ['su','Final','Stall PPT','2026-10-31','done',[['Product final decision','done'],['Design: packaging, problem statement, gap','done'],['Sourcing','done'],['Rate card and art prints','done'],['Final requirements','done']]],
 ['si','Final','Final report','2026-10-31','prog',[['Information architecture','todo'],['Mid-fi mockups','todo'],['Prototype','todo'],['Final report: digital','prog'],['Final report: printed','todo']]],
 ['mp','Final','Mini project','2026-11-06','prog',[['Idea discussion','prog'],['Tools exploration','prog'],['Case study','todo'],['Deploy','todo'],['Test pilot','todo']]],
];
const defaultItems=()=>RAW.map(([c,type,t,due,st,subs],i)=>({id:i+1,c,type,t,due,st,subs:(subs||[]).map(([t,st])=>({t,st}))}));
const defaultRems=()=>[
  {id:1,t:'Mini project: tools exploration call',at:'2026-10-21T15:00',c:'mp'},
  {id:2,t:'Journal entries for Data Viz and Design Research',at:'2026-10-21T20:00',c:'dv'},
  {id:3,t:'Export the trailer, due Friday',at:'2026-10-22T10:00',c:'av'},
  {id:4,t:'Book the print shop for the internship report',at:'2026-10-24T11:00',c:'si'},
  {id:5,t:'Final checks before the 31 Oct submissions',at:'2026-10-30T18:00',c:'pk'},
  {id:6,t:'Movie and mini project due tomorrow',at:'2026-11-05T18:00',c:'mp'},
];
// Weekly class timetable (sample: the tracker has no timetable), 3 Aug to 6 Nov
const TT={1:[[10,13,'dv','Data Viz class'],[14,17,'ge','Game Engine lab']],2:[[10,13,'pk','Packaging studio'],[14,16,'ad','Design Research']],3:[[10,13,'av','AV Movie'],[15,17,'si','Internship report work']],4:[[10,12,'mp','Mini project'],[14,16,'su','Start-up']],5:[[10,12,'cs','Context Setting'],[14,16,'dv','Data Viz studio']]};
const SES=(()=>{const out=[];for(let d=P(SEM_START);d<=P('2026-11-06');d=add(d,1)){const w=d.getDay(),k=iso(d);(TT[w]||[]).forEach(([s,e,c,t])=>{if(c==='cs'&&k>'2026-10-16')return;if(c==='su'&&k>FINALS)return;out.push({d:k,s,e,c,t})})}return out})();
const sesBy={};SES.forEach(s=>(sesBy[s.d]=sesBy[s.d]||[]).push(s));

/* ===================== State ===================== */
const KEY='sem3-dashboard-v1';
let S={view:'overview',cat:'all',tab:'prog',dl:'soon',remv:'today',period:'month',mix:'status',gsel:'pk',open:{1:true,17:true},cal:{m:new Date(2026,9,1),sel:TISO},items:defaultItems(),rems:defaultRems(),nid:200};
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o.items)S.items=o.items;if(o.rems)S.rems=o.rems;if(o.nid)S.nid=o.nid}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({items:S.items,rems:S.rems,nid:S.nid}))}catch(e){}};

const inCat=c=>S.cat==='all'||S.cat===c;
const vis=()=>S.items.filter(t=>inCat(t.c));
const dd=t=>t.due?diff(P(t.due),TODAY):null;
const isLate=t=>t.st!=='done'&&t.due&&dd(t)<0;
const deliverables=()=>vis().filter(t=>t.type!=='Ongoing');
const dueShort=t=>{const n=dd(t);if(n===null)return 'No date';if(n<0)return `${-n}d late`;if(n===0)return 'Today';if(n===1)return 'Tmrw';return n<=14?`${n}d`:fmt(P(t.due))};
const dueLong=t=>{const n=dd(t);if(n===null)return 'No due date in the tracker';return `${fmtY(P(t.due))}, ${n<0?-n+' days late':n===0?'today':n===1?'tomorrow':'in '+n+' days'}`};
const STN={done:'Done',prog:'In progress',todo:'Yet to start'};
// course progress weights subtasks as units of work
function cprog(id){let n=0,d=0;S.items.forEach(t=>{if(t.c!==id||t.type==='Ongoing')return;if(t.subs.length){t.subs.forEach(s=>{n++;if(t.st==='done'||s.st==='done')d++})}else{n++;if(t.st==='done')d++}});return n?d/n:0}
function projects(){return COURSES.map(c=>{const its=S.items.filter(t=>t.c===c.id&&t.due);const end=its.reduce((m,t)=>t.due>m?t.due:m,FINALS);
  const ms=[...new Map(its.map(t=>[t.due+t.t,[t.t,t.due]])).values()];return {id:c.id,n:c.s,full:c.n,c:c.id,s:SEM_START,e:end,m:ms,pr:cprog(c.id)}})}

/* ===================== Course bar graph (hero + insights) ===================== */
function courseBars(el,{dark=false,showPct=false}={}){
  const W=el.clientWidth||300,H=el.clientHeight||140,top=showPct?16:2,pb=18,ih=H-pb-top,n=COURSES.length,bw=W/n,w=Math.min(dark?44:26,bw*.58);
  const ink=dark?'#111':'#111',track=dark?'rgba(0,0,0,.16)':'rgba(0,0,0,.12)';
  let h=`<svg class="chart" width="${W}" height="${H}" role="img" aria-label="Completion by course bar graph">`;
  COURSES.forEach((c,i)=>{const x=bw*(i+.5),r=cprog(c.id),bh=r?Math.max(w,ih*r):0,dim=S.cat!=='all'&&S.cat!==c.id;
    h+=`<g style="cursor:pointer;opacity:${dim?.3:1}" data-cat="${c.id}" data-tip="<b>${esc(c.n)}</b><br>${Math.round(r*100)}% of the work done">`;
    h+=`<rect x="${bw*i}" y="0" width="${bw}" height="${H}" style="fill:transparent"/><rect x="${x-w/2}" y="${top}" width="${w}" height="${ih}" rx="${w/2}" style="fill:${track}"/>`;
    if(bh)h+=`<rect x="${x-w/2}" y="${top+ih-bh}" width="${w}" height="${bh}" rx="${w/2}" style="fill:${ink}"/>`;
    h+=`<circle cx="${x}" cy="${top+ih-Math.max(bh,w)+w/2}" r="${Math.min(4,w/5)}" style="fill:${c.c};stroke:#111;stroke-width:1.2"/>`;

  el.innerHTML=h+'</svg>';
}

/* ===================== Gantt ===================== */
function renderGantt(tgt){
  const el=$(tgt),fit=FIT(),W=fit?(el.clientWidth||560):Math.max(640,el.clientWidth),LW=Math.min(220,Math.max(130,W*.22)),TH=18,PROJ=projects();
  const rs={week:add(TODAY,-14),month:add(TODAY,-60),year:P(SEM_START)}[S.period],re={week:add(TODAY,21),month:add(TODAY,30),year:P('2026-11-15')}[S.period];
  const span=diff(re,rs),sx=d=>LW+(diff(d,rs)/span)*(W-LW-6),id=tgt.slice(1);
  const RH=fit?Math.min(52,Math.max(9,((el.clientHeight||200)-TH-2)/PROJ.length)):30,BH=Math.max(6,Math.min(18,RH*.45));
  const H=TH+PROJ.length*RH;let h=`<svg class="chart" width="${W}" height="${H}" role="img" aria-label="Course timeline Gantt chart"><defs>${CK.map(c=>`<linearGradient id="g${id}-${c}" x1="0" x2="1"><stop offset="0" stop-color="${cv(c)}" stop-opacity=".35"/><stop offset="1" stop-color="${cv(c)}"/></linearGradient>`).join('')}</defs>`;
  const ticks=[];if(S.period==='week'){let d=add(rs,(8-rs.getDay())%7);while(d<=re){ticks.push([d,fmt(d)]);d=add(d,7)}}else{let d=new Date(rs.getFullYear(),rs.getMonth()+(rs.getDate()>1?1:0),1);while(d<=re){ticks.push([d,MON[d.getMonth()]]);if(S.period==='month')ticks.push([new Date(d.getFullYear(),d.getMonth(),15),'15 '+MON[d.getMonth()]]);d=new Date(d.getFullYear(),d.getMonth()+1,1)}}
  const tx=sx(TODAY);
  ticks.forEach(([d,l])=>{const X=sx(d);if(X<LW||X>W-6)return;h+=`<line x1="${X}" x2="${X}" y1="${TH-2}" y2="${H}" style="stroke:#262626"/>`;if(Math.abs(X-tx)>32&&X<W-26)h+=`<text x="${X}" y="${TH-6}" text-anchor="middle">${l}</text>`});
  const fx=sx(P(FINALS));if(fx>LW&&fx<W)h+=`<line x1="${fx}" x2="${fx}" y1="${TH-2}" y2="${H}" style="stroke:#555;stroke-dasharray:3 3"/>`;
  PROJ.forEach((p,i)=>{const Y=TH+i*RH,cy=Y+RH/2,dim=!inCat(p.c),sel=S.gsel===p.id,Sd=P(p.s),Ed=P(p.e);
    const plan=Math.min(1,Math.max(0,(TODAY-Sd)/(Ed-Sd))),gap=p.pr-plan;
    const tipT=`<b>${esc(p.full)}</b><br>${fmt(Sd)} to ${fmtY(Ed)}<br>${Math.round(p.pr*100)}% done, ${gap>=-.05?'on track':Math.round(-gap*100)+' pts behind plan'}`;
    h+=`<g style="opacity:${dim?.25:1};cursor:pointer" data-proj="${p.id}" data-tip="${tipT.replace(/"/g,'&quot;')}"><rect x="0" y="${Y}" width="${W}" height="${RH}" rx="6" style="fill:${sel&&tgt==='#gchart'?'#262626':'transparent'}"/><circle cx="6" cy="${cy}" r="4" style="fill:${cv(p.c)}"/><text x="16" y="${cy+4}" style="font-size:${RH>30?13:RH<15?10.5:11.5}px;fill:var(--fg);font-weight:600">${esc(p.n)}</text>`;
    const a=Math.max(sx(Sd),LW),b=Math.min(sx(Ed),W-6);
    if(b>a){const pb=Math.min(Math.max(sx(new Date(Sd.getTime()+(Ed-Sd)*p.pr)),a),b);
      h+=`<rect x="${a}" y="${cy-BH/2}" width="${b-a}" height="${BH}" rx="${BH/2}" style="fill:#2A2A2A"/>`;
      if(pb>a)h+=`<rect x="${a}" y="${cy-BH/2}" width="${Math.max(BH,pb-a)}" height="${BH}" rx="${BH/2}" style="fill:${cv(p.c)}"/>`;
      p.m.forEach(([ml,md])=>{const X=sx(P(md));if(X>=LW&&X<=W-4)h+=`<circle cx="${X}" cy="${cy}" r="${Math.max(2.5,BH/2-2)}" style="fill:#161616;stroke:var(--fg);stroke-width:1.5" data-tip="<b>${esc(ml)}</b><br>${fmtY(P(md))}"/>`})}
    h+='</g>'});
  h+=`<line x1="${tx}" x2="${tx}" y1="${TH-2}" y2="${H}" style="stroke:#F2672B;stroke-width:1.5;stroke-dasharray:3 3"/><text x="${tx}" y="${TH-6}" text-anchor="middle" style="fill:#F2672B;font-weight:700">Today</text>`;
  el.innerHTML=h+'</svg>';
}

function renderProg(){
  const el=$('#prog'),W=el.clientWidth||500,H=el.clientHeight||260,rows=projects(),LW=Math.min(170,W*.34),TH=16,RH=Math.min(34,(H-TH)/rows.length),BH=Math.min(11,RH*.42),sx=f=>LW+f*(W-LW-44);
  let h=`<svg class="chart" width="${W}" height="${TH+rows.length*RH}" role="img" aria-label="Course progress compared with plan">`;
  [0,.5,1].forEach(f=>h+=`<line x1="${sx(f)}" x2="${sx(f)}" y1="${TH-4}" y2="${TH+rows.length*RH}" style="stroke:#E3E3DE"/><text x="${sx(f)}" y="${TH-6}" text-anchor="middle">${f*100}%</text>`);
  rows.forEach((p,i)=>{const cy=TH+i*RH+RH/2,pr=p.pr,S0=P(p.s),E0=P(p.e),plan=Math.min(1,Math.max(0,(TODAY-S0)/(E0-S0))),dim=!inCat(p.c),gap=pr-plan;
    h+=`<g style="opacity:${dim?.25:1};cursor:pointer" data-proj="${p.id}" data-tip="<b>${esc(p.full)}</b><br>${Math.round(pr*100)}% done, plan is ${Math.round(plan*100)}% by today<br>${gap>=-.05?'On track':Math.round(-gap*100)+' pts behind'}">
      <rect x="0" y="${cy-RH/2}" width="${W}" height="${RH}" style="fill:transparent"/>
      <circle cx="5" cy="${cy}" r="4" style="fill:${cv(p.c)};stroke:#111;stroke-width:1.2"/><text x="15" y="${cy+4}" style="font-size:12px;fill:#111;font-weight:600">${esc(p.n)}</text>
      <rect x="${sx(0)}" y="${cy-BH/2}" width="${sx(1)-sx(0)}" height="${BH}" rx="${BH/2}" style="fill:#E3E3DE"/>
      ${pr>0?`<rect x="${sx(0)}" y="${cy-BH/2}" width="${Math.max(BH,sx(pr)-sx(0))}" height="${BH}" rx="${BH/2}" style="fill:#111"/>`:''}
      <rect x="${sx(plan)-1.5}" y="${cy-BH/2-4}" width="3" height="${BH+8}" rx="1.5" style="fill:#F2672B"/>
      <text x="${W-2}" y="${cy+4}" text-anchor="end" style="font-size:12px;font-weight:700;fill:${gap>=-.05?'#111':'#C9481A'}">${Math.round(pr*100)}%</text></g>`});
  el.innerHTML=h+'</svg>';
}
function renderMil(){
  const ms=vis().filter(t=>t.due&&t.st!=='done'&&dd(t)>=-7).sort((a,b)=>a.due.localeCompare(b.due)||(a.type==='Final'?-1:1));
  $('#milCount').textContent=ms.length;
  $('#mil').innerHTML=ms.length?ms.map(t=>{const D=P(t.due),n=dd(t);return `<button class="mrow" data-goto="${t.id}"><span class="dt"><b>${D.getDate()}</b><small>${MON[D.getMonth()]}</small></span><span style="min-width:0"><div class="nm">${esc(t.t)}</div><div class="pj">${esc(CC[t.c].n)}, ${t.type.toLowerCase()}</div></span><em style="${n<0?'color:#C9481A':''}">${n<0?-n+'d late':n===0?'Today':n+'d'}</em></button>`}).join(''):'<p class="empty">Nothing dated ahead</p>';
}

/* ===================== Insights ===================== */
function renderTrend(){
  const D=deliverables(),done=D.filter(t=>t.st==='done').length;
  $('#trBig').textContent=(D.length?Math.round(done/D.length*100):0)+'%';
  $('#trNote').textContent=`${done} / ${D.length} Deliverables`;
  courseBars($('#trend'),{dark:true,showPct:true});
}
function renderMix(){
  document.querySelectorAll('#mixMode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.mix));
  const D=deliverables(),done=D.filter(t=>t.st==='done').length,pct=D.length?Math.round(done/D.length*100):0;
  const st=t=>t.st==='done'?'done':isLate(t)?'late':t.st;
  let parts;
  if(S.mix==='status')parts=[['done','Done','#FFFFFF'],['prog','In progress','var(--lime)'],['todo','To do','url(#stripe)'],['late','Late','var(--orange)']].map(([k,l,col])=>({k,l,col,v:D.filter(t=>st(t)===k).length}));
  else parts=COURSES.map(c=>({k:c.id,l:c.s,col:c.c,v:S.items.filter(t=>t.c===c.id&&t.type!=='Ongoing').length}));
  const tot=parts.reduce((a,b)=>a+b.v,0);
  $('#ovPct').innerHTML=`${pct}<span style="font-size:.55em;letter-spacing:-.02em">%</span>`;
  const soon=D.filter(t=>t.st!=='done'&&t.due&&dd(t)>=0&&dd(t)<=7).length,late=D.filter(isLate).length;
  const up='<span><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 15 6-6 6 6"/></svg></span>';
  $('#ovPills').innerHTML=`<button data-act="up">${up}${soon} due within 7 days</button>`+(late?`<button data-act="late" style="border-color:#fff">${up}${late} late</button>`:'');
  const pbEl=$('#donut').closest('.pb'),fit=FIT(),size=fit?Math.max(110,Math.min(300,pbEl.clientHeight-170,pbEl.clientWidth*.6)):190;
  const C=100,R0=96,Rb=66,Wb=34;
  let h=`<svg width="${size}" height="${size}" viewBox="0 0 200 200" role="img" aria-label="Deliverables breakdown"><defs><radialGradient id="gCore" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></radialGradient><linearGradient id="gArc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#DDF35B"/></linearGradient><pattern id="stripe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2E5BF0"/><rect width="2.5" height="6" fill="rgba(255,255,255,.55)"/></pattern></defs>`;
  const Lo=2*Math.PI*R0;h+=`<circle cx="${C}" cy="${C}" r="${R0}" style="fill:none;stroke:rgba(255,255,255,.2);stroke-width:4"/><circle cx="${C}" cy="${C}" r="${R0}" transform="rotate(-90 ${C} ${C})" style="fill:none;stroke:url(#gArc);stroke-width:4;stroke-linecap:round;stroke-dasharray:${pct/100*Lo} ${Lo}"/>`;
  h+=`<circle cx="${C}" cy="${C}" r="${Rb}" style="fill:none;stroke:#111;stroke-width:${Wb}"/>`;
  const L=2*Math.PI*Rb;let off=0;
  parts.forEach(pt=>{if(!pt.v)return;const f=pt.v/tot,dim=S.mix==='cat'&&S.cat!=='all'&&S.cat!==pt.k;
    h+=`<circle class="arc" cx="${C}" cy="${C}" r="${Rb}" transform="rotate(${-90+off/L*360} ${C} ${C})" style="fill:none;stroke:${pt.col};stroke-width:${Wb-8};stroke-dasharray:${Math.max(.5,f*L-3)} ${L};opacity:${dim?.25:1}" ${S.mix==='cat'?`data-cat="${pt.k}"`:''} data-tip="<b>${esc(pt.l)}</b><br>${pt.v} deliverables, ${Math.round(f*100)}%"/>`;off+=f*L});
  h+=`<circle cx="${C}" cy="${C}" r="32" style="fill:url(#gCore)"/><text x="${C}" y="${C+3}" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#fff">${tot}</text><text x="${C}" y="${C+17}" text-anchor="middle" style="font-size:9.5px;fill:rgba(255,255,255,.8)">deliverables</text></svg>`;
  $('#donut').innerHTML=h;
  $('#mleg').innerHTML=parts.map(p=>`<button ${S.mix==='cat'?`data-cat="${p.k}" aria-pressed="${S.cat===p.k}"`:'tabindex="-1" style="cursor:default"'}><i style="background:${p.col.startsWith('url')?'repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 4px)':p.col};box-shadow:0 0 0 1px rgba(0,0,0,.35)"></i><span>${esc(p.l)}</span><span class="ct">${p.v}</span></button>`).join('');
}
function renderTypes(){
  const v=vis(),rows=[['Final','Final assignments'],['Assignment','Assignments'],['Class exercise','Class exercises'],['Subtask','Subtasks'],['Ongoing','Ongoing']];
  const cnt=type=>{if(type==='Subtask'){const subs=v.flatMap(t=>t.subs.map(s=>t.st==='done'?'done':s.st));return{done:subs.filter(x=>x==='done').length,prog:subs.filter(x=>x==='prog').length,todo:subs.filter(x=>x==='todo').length}}
    const its=v.filter(t=>t.type===type);return{done:its.filter(t=>t.st==='done').length,prog:its.filter(t=>t.st==='prog').length,todo:its.filter(t=>t.st==='todo').length}};
  const all=rows.map(([k,l])=>({k,l,...cnt(k)}));
  const total=all.reduce((a,r)=>a+r.done+r.prog+r.todo,0);
  $('#focusBig').textContent=total;$('#focusPer').textContent='Items & Subtasks';
  $('#focus').innerHTML=`<div class="vlegend" style="margin-bottom:6px"><span><i style="width:10px;height:10px;border-radius:3px;background:#DDF35B"></i>Done</span><span><i style="width:10px;height:10px;border-radius:3px;background:#F5F5F2"></i>In progress</span><span><i style="width:10px;height:10px;border-radius:3px;background:#555"></i>Yet to start</span></div>`+
    all.map(r=>{const n=r.done+r.prog+r.todo;if(!n)return'';return `<div class="typerow" data-tip="<b>${r.l}</b><br>${r.done} done, ${r.prog} in progress, ${r.todo} yet to start"><b>${r.l}</b><div class="stack">${r.done?`<span style="flex:${r.done};background:#DDF35B"></span>`:''}${r.prog?`<span style="flex:${r.prog};background:#F5F5F2"></span>`:''}${r.todo?`<span style="flex:${r.todo};background:#555"></span>`:''}</div><em>${r.done}/${n}</em></div>`}).join('');
}

/* ===================== Render & events ===================== */
function render(){
  renderNav();
  if(S.view==='overview'){renderHero();renderTasks();renderNext();renderRems();renderCal()}
  else if(S.view==='projects')renderProjects();
  else{renderTrend();renderMix();renderTypes()}
}
function setItem(k,st){k.st=st;if(st==='done')k.subs.forEach(s=>s.st='done')}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-day],[data-proj],[data-cat],.arc');if(!t)return;
  const D=t.dataset;
  if(D.view){S.view=D.view;return render()}
  if(D.p){S.period=D.p;return render()}
  if(D.cat){S.cat=(S.cat===D.cat&&D.cat!=='all')?'all':D.cat;return render()}
  if(D.tab){S.tab=D.tab;return renderTasks()}
  if(D.dl){S.dl=D.dl;return renderNext()}
  if(D.remv){S.remv=D.remv;return renderRems()}
  if(D.m){S.mix=D.m;return renderMix()}
  if(D.goto)return gotoTask(+D.goto);
  if(D.exp){S.open[D.exp]=!S.open[D.exp];return renderTasks()}
  if(D.chk){const k=S.items.find(x=>x.id==D.chk),prev=JSON.stringify(k);setItem(k,k.st==='done'?'prog':'done');save();render();
    if(k.st==='done')toast(`Marked “${k.t}” done`,()=>{Object.assign(k,JSON.parse(prev));save();render()});return}
  if(D.sub){const[id,i]=D.sub.split(':'),k=S.items.find(x=>x.id==id),s=k.subs[i];s.st=s.st==='done'?'prog':'done';
    if(k.subs.every(x=>x.st==='done')){if(k.st!=='done')toast(`All subtasks done, so “${k.t}” is complete`);k.st='done'}else if(k.st==='done'||k.st==='todo')k.st='prog';save();return render()}
  if(D.act==='up'){S.view='overview';S.dl='soon';S.tab='prog';render();if(!FIT())$('.a-next').scrollIntoView({behavior:'smooth'});return}
  if(D.act==='late'){S.view='overview';S.tab='late';render();if(!FIT())$('.a-tsk').scrollIntoView({behavior:'smooth'});return}
  if(D.act==='add')return openModal();
  if(D.snooze){const r=S.rems.find(x=>x.id==D.snooze),d=new Date(new Date(r.at).getTime()+36e5);r.at=`${iso(d)}T${hh(d.getHours()+d.getMinutes()/60)}`;save();renderRems();return toast('Snoozed for 1 hour')}
  if(D.rdone){const i=S.rems.findIndex(x=>x.id==D.rdone),[r]=S.rems.splice(i,1);save();renderRems();return toast('Reminder cleared',()=>{S.rems.push(r);save();renderRems()})}
  if(D.proj){S.gsel=D.proj;S.view='projects';return render()}
  if(D.day){S.cal.sel=D.day;return renderCal()}
});
$('#calPrev').onclick=()=>{S.cal.m=new Date(S.cal.m.getFullYear(),S.cal.m.getMonth()-1,1);renderCal()};
$('#calNext').onclick=()=>{S.cal.m=new Date(S.cal.m.getFullYear(),S.cal.m.getMonth()+1,1);renderCal()};
function addRem(){const t=$('#remText').value.trim(),w=$('#remWhen').value||'18:00';if(!t){$('#remText').focus();return toast('Write what to be reminded about')}
  const [H,M]=w.split(':').map(Number),day=(H+M/60)<=(NOW.getHours()+NOW.getMinutes()/60)?rel(1):TISO;
  S.rems.push({id:++S.nid,t,at:`${day}T${w}`,c:S.cat==='all'?'dv':S.cat});$('#remText').value='';save();
  $('#addRem').hidden=true;$('#remToggle').setAttribute('aria-expanded',false);if(day!==TISO)S.remv='all';renderRems();toast(day===TISO?`Reminder set for ${w} today`:`Reminder set for ${w} tomorrow`)}
$('#remToggle').onclick=()=>{const f=$('#addRem');if(!f.hidden&&$('#remText').value.trim())return addRem();const o=f.hidden;f.hidden=!o;$('#remToggle').setAttribute('aria-expanded',o);if(o)$('#remText').focus()};
$('#remText').addEventListener('keydown',e=>{if(e.key==='Enter')addRem();if(e.key==='Escape')$('#addRem').hidden=true});
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme!=='light';r.dataset.theme=dark?'light':'dark';render()};
const modal=$('#modal');$('#fC').innerHTML=COURSES.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('');
function openModal(){$('#fT').value='';$('#fS').value='';$('#fD').value=rel(7);$('#fErr').textContent='';$('#fC').value=S.cat==='all'?'dv':S.cat;modal.classList.add('open');modal.setAttribute('aria-hidden','false');setTimeout(()=>$('#fT').focus(),30)}
const close=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true')};
$('#mCancel').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))close()});
$('#mSave').onclick=()=>{const t=$('#fT').value.trim(),d=$('#fD').value;if(!t){$('#fErr').textContent='Give the deliverable a name.';return}
  const k={id:++S.nid,c:$('#fC').value,type:$('#fP').value,t,due:d||null,st:'todo',subs:$('#fS').value.split(',').map(s=>s.trim()).filter(Boolean).map(t=>({t,st:'todo'}))};
  S.items.push(k);if(k.subs.length)S.open[k.id]=true;save();close();S.tab='todo';gotoTask(k.id);toast(`Added “${t}”`)};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,120)});
render();
document.fonts&&document.fonts.ready.then(render);
</script>
</body>
